# Central project configuration. Paths are relative to the repository root.

dataset:
  kaggle_competition: h-and-m-personalized-fashion-recommendations
  # Only the tabular files are needed; the ~29 GB images folder is skipped.
  files:
    - transactions_train.csv
    - customers.csv
    - articles.csv

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  models_dir: models

split:
  # The final N weeks of transactions are held out for evaluation.
  test_weeks: 1
  # Only the most recent N weeks are used for training (older fashion data is stale).
  train_weeks: 12

cleaning:
  # Customers with fewer purchases than this in the training window are flagged cold-start.
  cold_start_min_purchases: 5

spark:
  # WSL2 gets half of a 16 GB laptop's RAM (about 7.5 GB); Spark spills to disk beyond this.
  driver_memory: 5g
  shuffle_partitions: 64

model:
  embedding_dim: 64
  history_length: 20
  batch_size: 4096
  learning_rate: 0.05
  epochs: 5

evaluation:
  k_values: [12, 50, 100]

serving:
  top_k: 12
  ann_candidates: 100
